<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список пользователей</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
            color: #111827;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            padding: 24px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
            box-sizing: border-box;
            background-color: #ffffff;
            border-left: 1px solid #e5e7eb;
            border-right: 1px solid #e5e7eb;
        }

        h1 {
            font-size: 22px;
            color: #111827;
            margin-top: 0;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #22252a;
            text-transform: uppercase;
        }

        .page-actions { display: flex; justify-content: flex-end; margin-bottom: 20px; }

        .btn-primary {
            padding: 10px 16px; background-color: #22252a; color: #ffffff;
            border: none; border-radius: 4px; cursor: pointer; font-weight: 700; text-transform: uppercase;
        }
        .btn-primary:hover { background-color: #f25c22; }

        /* Таблица пользователей */
        .table-container { overflow-x: auto; border: 1px solid #d1d5db; border-radius: 4px; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #e5e7eb; }
        .data-table th { background-color: #22252a; color: #ffffff; font-weight: 600; text-transform: uppercase; font-size: 12px; }
        .data-table tbody tr { cursor: pointer; transition: background-color 0.1s; }
        .data-table tbody tr:nth-child(even) { background-color: #f9fafb; }
        .data-table tbody tr:hover { background-color: #f3f4f6; box-shadow: inset 3px 0 0 #f25c22; }

        .loading, .error { text-align: center; padding: 40px; color: #4b5563; font-weight: 600; }

        /* Модальное окно создания пользователя */
        .modal-overlay {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center;
        }
        .modal-content {
            background-color: #ffffff; padding: 24px; border-radius: 4px; width: 600px; max-width: 90%;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15); border-top: 4px solid #f25c22;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #e5e7eb; padding-bottom: 10px; }
        .modal-title { font-size: 18px; font-weight: 700; text-transform: uppercase; }
        .close-button { font-size: 24px; cursor: pointer; color: #9ca3af; border: none; background: none; }
        .close-button:hover { color: #111827; }

        .modal-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 700; font-size: 12px; color: #4b5563; text-transform: uppercase; }
        .form-group input, .form-group select { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; box-sizing: border-box; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: #f25c22; box-shadow: 0 0 0 2px rgba(242, 92, 34, 0.1); }
        .form-group.full { grid-column: 1 / -1; }

        .form-actions { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; border-top: 1px solid #e5e7eb; padding-top: 15px; }
        .cancel-button { padding: 8px 16px; background-color: #ffffff; border: 1px solid #d1d5db; border-radius: 4px; cursor: pointer; font-weight: 600; }
        .cancel-button:hover { background-color: #f3f4f6; }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container">
        <h1>Сотрудники системы</h1>

        <div class="page-actions">
            <button class="btn-primary" id="createUserButton">+ Добавить сотрудника</button>
        </div>

        <div class="table-container">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>ФИО Сотрудника</th>
                        <th>Бригада</th>
                        <th>Смена</th>
                    </tr>
                </thead>
                <tbody id="usersContainer">
                    <tr><td colspan="4" class="loading">Загрузка данных...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <div id="createUserModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Регистрация сотрудника</div>
                <button class="close-button" id="closeModalBtn">&times;</button>
            </div>
            <form id="userForm" class="modal-form">
                <div class="form-group full">
                    <label>Логин системы *</label>
                    <input type="text" id="login" required>
                </div>
                <div class="form-group full">
                    <label>Пароль *</label>
                    <input type="password" id="password" required>
                </div>
                <div class="form-group full">
                    <label>Роль / Доступ *</label>
                    <select id="status_id" required>
                        <option value="1">Руководитель</option>
                        <option value="2">Оператор</option>
                        <option value="3">Гость</option>
                        <option value="4">Модератор пользователей</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Фамилия</label>
                    <input type="text" id="lastname">
                </div>
                <div class="form-group">
                    <label>Имя</label>
                    <input type="text" id="firstname">
                </div>
                <div class="form-group full">
                    <label>Отчество</label>
                    <input type="text" id="secondname">
                </div>
                <div class="form-group">
                    <label>Номер смены</label>
                    <input type="number" id="shift">
                </div>
                <div class="form-group">
                    <label>Номер бригады</label>
                    <input type="number" id="brigade">
                </div>

                <div class="form-actions">
                    <button type="button" class="cancel-button" id="cancelButton">Отмена</button>
                    <button type="submit" class="btn-primary">Зарегистрировать</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        async function loadComponents() {
            try {
                const headerRes = await fetch('/static/components/header.html');
                if (headerRes.ok) document.getElementById('header-placeholder').innerHTML = await headerRes.text();

                const footerRes = await fetch('/static/components/footer.html');
                if (footerRes.ok) document.getElementById('footer-placeholder').innerHTML = await footerRes.text();
            } catch (error) { console.error(error); }
        }

        async function fetchAllUsers() {
            try {
                const response = await fetch('/api/workers/get_filtered/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ page_size: 100, page_number: 1, filtres: {} })
                });
                if (!response.ok) throw new Error(`Ошибка HTTP: ${response.status}`);
                return await response.json();
            } catch (error) { return null; }
        }

        async function loadAllUsers() {
            const tbody = document.getElementById('usersContainer');
            try {
                const users = await fetchAllUsers();
                if (!users || users.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="error">Пользователи не найдены</td></tr>';
                    return;
                }
                tbody.innerHTML = '';
                users.forEach(user => {
                    const tr = document.createElement('tr');
                    const fullName = `${user.lastname || ''} ${user.firstname || ''} ${user.secondname || ''}`.trim();
                    const userId = user.user_id || user.worker_id;

                    tr.innerHTML = `
                        <td><strong>${userId}</strong></td>
                        <td>${fullName || '—'}</td>
                        <td>${user.brigade || '—'}</td>
                        <td>${user.shift || '—'}</td>
                    `;
                    tr.onclick = () => window.location.href = `/html/current_user/?id=${userId}`;
                    tbody.appendChild(tr);
                });
            } catch (error) { tbody.innerHTML = `<tr><td colspan="4" class="error">Ошибка: ${error.message}</td></tr>`; }
        }

        // Модальное окно
        const modal = document.getElementById('createUserModal');
        document.getElementById('createUserButton').onclick = () => { modal.style.display = 'flex'; }
        document.getElementById('closeModalBtn').onclick = () => { modal.style.display = 'none'; }
        document.getElementById('cancelButton').onclick = () => { modal.style.display = 'none'; }
        window.onclick = (e) => { if (e.target == modal) modal.style.display = 'none'; }

        // Отправка формы с SHA-256
        document.getElementById('userForm').onsubmit = async function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const hashPassword = await sha256(password);

            const userData = {
                firstname: document.getElementById('firstname').value,
                lastname: document.getElementById('lastname').value,
                secondname: document.getElementById('secondname').value,
                shift: parseInt(document.getElementById('shift').value) || null,
                brigade: parseInt(document.getElementById('brigade').value) || null
            };

            const requestData = {
                login: document.getElementById('login').value,
                hash_password: hashPassword,
                status_id: parseInt(document.getElementById('status_id').value),
                user_data: userData,
                worker_id: 0
            };

            try {
                const response = await fetch('/api/workers/create/', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(requestData)
                });
                if (!response.ok) throw new Error(`Ошибка HTTP: ${response.status}`);
                modal.style.display = 'none';
                document.getElementById('userForm').reset();
                loadAllUsers();
            } catch (error) { alert('Ошибка при создании пользователя: ' + error.message); }
        };

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        document.addEventListener('DOMContentLoaded', () => { loadComponents(); loadAllUsers(); });
    </script>
</body>
</html>
