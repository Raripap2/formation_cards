<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Информация о листе</title>
    <style>
        /* Индустриальные стили ЛПЦ-1 */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
            color: #111827;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            padding: 24px;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
            box-sizing: border-box;
            background-color: #ffffff;
            border-left: 1px solid #e5e7eb;
            border-right: 1px solid #e5e7eb;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            padding: 8px 16px;
            margin-bottom: 20px;
            background-color: #ffffff;
            color: #22252a;
            text-decoration: none;
            border-radius: 4px;
            border: 1px solid #d1d5db;
            font-weight: 600;
            transition: all 0.1s ease;
        }
        .back-button:hover { background-color: #f3f4f6; border-color: #9ca3af; }

        .sheet-container {
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            padding: 24px;
        }

        .sheet-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid #22252a;
        }

        .sheet-title {
            font-size: 22px;
            font-weight: 700;
            color: #111827;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sheet-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 24px;
        }

        .detail-group {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 4px;
            padding: 20px;
        }

        .detail-group-title {
            font-weight: 700;
            margin-bottom: 15px;
            color: #22252a;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #d1d5db;
            padding-bottom: 6px;
        }

        .detail-row {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px dashed #e5e7eb;
        }
        .detail-row:last-child { border-bottom: none; }

        .detail-label {
            font-weight: 600;
            width: 180px;
            color: #4b5563;
        }

        .detail-value {
            flex: 1;
            color: #111827;
            font-weight: 500;
        }

        .loading, .error { text-align: center; padding: 40px; color: #4b5563; font-weight: 600; }
        .error { color: #c5221f; }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="container">
        <a href="/html/allsheets/" class="back-button">← К списку листов</a>

        <div class="sheet-container" id="sheetContainer">
            <div class="loading">Загрузка данных листа с сервера...</div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const sheetId = urlParams.get('id');

        async function loadComponents() {
            try {
                const headerRes = await fetch('/static/components/header.html');
                if (headerRes.ok) document.getElementById('header-placeholder').innerHTML = await headerRes.text();

                const footerRes = await fetch('/static/components/footer.html');
                if (footerRes.ok) document.getElementById('footer-placeholder').innerHTML = await footerRes.text();
            } catch (error) { console.error('Ошибка компонентов:', error); }
        }

        async function fetchSheetData() {
            try {
                const response = await fetch('/api/sheets/get', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sheet_ids: [String(sheetId)] })
                });
                if (!response.ok) throw new Error(`Ошибка HTTP: ${response.status}`);
                const data = await response.json();
                return data[0];
            } catch (error) {
                console.error(error);
                return null;
            }
        }

        async function displaySheetData() {
            const container = document.getElementById('sheetContainer');
            if (!sheetId) { container.innerHTML = '<div class="error">ID листа не указан</div>'; return; }

            const sheetData = await fetchSheetData();
            if (!sheetData) { container.innerHTML = '<div class="error">Не удалось загрузить данные листа</div>'; return; }

            const area = (sheetData.plate_t * sheetData.plate_w * sheetData.plate_l).toFixed(2);

            container.innerHTML = `
                <div class="sheet-header">
                    <div class="sheet-title">Паспорт листа № ${sheetData.sheet_id || '—'}</div>
                </div>

                <div class="sheet-details">
                    <div class="detail-group">
                        <div class="detail-group-title">Основная информация</div>
                        <div class="detail-row"><div class="detail-label">Марка стали:</div><div class="detail-value"><strong>${sheetData.grade || '—'}</strong></div></div>
                        <div class="detail-row"><div class="detail-label">Номер плавки:</div><div class="detail-value">${sheetData.heat || '—'}</div></div>
                        <div class="detail-row"><div class="detail-label">Номер партии:</div><div class="detail-value">${sheetData.batch || '—'}</div></div>
                        <div class="detail-row"><div class="detail-label">Номер листа:</div><div class="detail-value">${sheetData.num_1 || '—'}</div></div>
                        <div class="detail-row"><div class="detail-label">Время маркировки:</div><div class="detail-value">${sheetData.marking_time || '—'}</div></div>
                    </div>

                    <div class="detail-group">
                        <div class="detail-group-title">Габариты</div>
                        <div class="detail-row"><div class="detail-label">Толщина (T):</div><div class="detail-value">${sheetData.plate_t || '0'} мм</div></div>
                        <div class="detail-row"><div class="detail-label">Ширина (W):</div><div class="detail-value">${sheetData.plate_w || '0'} мм</div></div>
                        <div class="detail-row"><div class="detail-label">Длина (L):</div><div class="detail-value">${sheetData.plate_l || '0'} мм</div></div>
                        <div class="detail-row"><div class="detail-label">Объем:</div><div class="detail-value">${area} мм³</div></div>
                    </div>

                    <div class="detail-group">
                        <div class="detail-group-title">Технические характеристики</div>
                        <div class="detail-row"><div class="detail-label">Углеродный эквивалент:</div><div class="detail-value">${sheetData.carb_eqiv || '—'}</div></div>
                        <div class="detail-row"><div class="detail-label">Коэф. трещиностойкости:</div><div class="detail-value">${sheetData.crack_resist || '—'}</div></div>
                        <div class="detail-row"><div class="detail-label">Код нарушения тех.:</div><div class="detail-value">${sheetData.tech_violation_code || '—'}</div></div>
                    </div>

                    <div class="detail-group">
                        <div class="detail-group-title">Производственная информация</div>
                        <div class="detail-row"><div class="detail-label">SB Order:</div><div class="detail-value"><strong>${sheetData.sb_order || '—'}</strong></div></div>
                        <div class="detail-row"><div class="detail-label">Номер части (порезка):</div><div class="detail-value">${sheetData.cut_part_num || '—'}</div></div>
                    </div>
                </div>
            `;
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadComponents();
            displaySheetData();
        });
    </script>
</body>
</html>
