<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Список карт формирования</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f3f4f6; /* Светлый промышленный фон */
            color: #111827;
            font-size: 14px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container {
            padding: 24px;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
            box-sizing: border-box;
            background-color: #ffffff;
            border-left: 1px solid #e5e7eb;
            border-right: 1px solid #e5e7eb;
        }

        h1 {
            font-size: 22px;
            color: #111827;
            margin-top: 0;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #22252a; /* Фирменный темный графит */
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Кнопки в стилистике бренда */
        .btn {
            padding: 8px 16px;
            border: 1px solid #d1d5db;
            background-color: #ffffff;
            color: #374151;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            border-radius: 4px;
            transition: all 0.1s ease;
        }

        .btn:hover {
            background-color: #f3f4f6;
            border-color: #9ca3af;
        }

        .btn-primary {
            background-color: #22252a; /* Графитовый */
            color: #ffffff;
            border-color: #22252a;
        }

        .btn-primary:hover {
            background-color: #111316;
            border-color: #111316;
        }

        .page-actions {
            margin-bottom: 20px;
            display: flex;
            justify-content: flex-end;
        }

        /* Панель фильтров */
        .filter-panel {
            background-color: #f9fafb;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            align-items: end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-weight: 700;
            margin-bottom: 6px;
            font-size: 12px;
            color: #4b5563;
            text-transform: uppercase;
        }

        .filter-group input,
        .filter-group select {
            padding: 8px 10px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 14px;
            background-color: #ffffff;
            color: #111827;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: #f25c22; /* Оранжевый фокус */
            box-shadow: 0 0 0 2px rgba(242, 92, 34, 0.1);
        }

        .filter-actions {
            grid-column: 1 / -1;
            display: flex;
            justify-content: flex-start;
            margin-top: 4px;
        }

        /* Таблица */
        .table-container {
            overflow-x: auto;
            border: 1px solid #d1d5db;
            border-radius: 4px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
        }

        .data-table th,
        .data-table td {
            padding: 10px 14px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        .data-table th {
            background-color: #22252a; /* Темная шапка таблицы для строгости */
            font-weight: 600;
            color: #ffffff;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Строки теперь кликабельны целиком */
        .data-table tbody tr {
            cursor: pointer;
            transition: background-color 0.1s;
        }

        .data-table tbody tr:nth-child(even) {
            background-color: #f9fafb;
        }

        .data-table tbody tr:hover {
            background-color: #f3f4f6;
            box-shadow: inset 3px 0 0 #f25c22; /* Оранжевый маркер строки при наведении */
        }

        /* Статусы (индустриальные блеклые тона, чтобы не резало глаза) */
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-open {
            background-color: #e6f4ea;
            color: #137333;
            border: 1px solid #c2e7cd;
        }

        .status-closed {
            background-color: #fce8e6;
            color: #c5221f;
            border: 1px solid #fad2cf;
        }

        /* Кнопка наверх */
        .scroll-to-top {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 45px;
            height: 45px;
            background-color: #22252a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 4px;
            font-size: 18px;
            border: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            z-index: 100;
        }

        .scroll-to-top:hover {
            background-color: #f25c22; /* Оранжевый при наведении */
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background-color: #ffffff;
            padding: 24px;
            width: 600px;
            max-width: 90%;
            border-radius: 4px;
            position: relative;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15);
            border-top: 4px solid #f25c22; /* Фирменная линия сверху */
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 22px;
            color: #9ca3af;
            background: none;
            border: none;
            cursor: pointer;
        }

        .modal-close:hover { color: #111827; }

        .modal-title {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: 700;
            color: #111827;
            text-transform: uppercase;
        }

        .form-row { display: flex; gap: 12px; margin-bottom: 12px; }
        .form-row .filter-group { flex: 1; }
        .form-submit { width: 100%; margin-top: 10px; padding: 10px; }

        .loading, .error, .loading-more { text-align: center; padding: 15px; color: #4b5563; font-weight: 600; }
    </style>
</head>
<body>

<div id="header-placeholder"></div>

<div class="container">
    <h1>Мониторинг формировочных карт</h1>

    <div class="page-actions">
        <button class="btn btn-primary" id="createFkButton">+ Создать ФК</button>
    </div>

    <div class="filter-panel">
        <div class="filter-group">
            <label for="filterCardId">ID карты:</label>
            <input type="text" id="filterCardId" placeholder="Поиск по ID">
        </div>
        <div class="filter-group">
            <label for="filterWagonNum">№ вагона:</label>
            <input type="text" id="filterWagonNum" placeholder="Номер вагона">
        </div>
        <div class="filter-group">
            <label for="filterBatch">Партия:</label>
            <input type="text" id="filterBatch" placeholder="Номер партии">
        </div>
        <div class="filter-group">
            <label for="filterGrade">Марка стали:</label>
            <input type="text" id="filterGrade" placeholder="Марка">
        </div>
        <div class="filter-group">
            <label for="filterPosition">Позиция:</label>
            <input type="text" id="filterPosition" placeholder="Стеллаж/место">
        </div>
        <div class="filter-group">
            <label for="filterOrderId">ID заказа:</label>
            <input type="text" id="filterOrderId" placeholder="Номер заказа">
        </div>
        <div class="filter-group">
            <label for="filterStatus">Статус:</label>
            <select id="filterStatus">
                <option value="">Все</option>
                <option value="0">Открыта</option>
                <option value="1">Закрыта</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="sortField">Сортировать по:</label>
            <select id="sortField">
                <option value="card_id">ID карты</option>
                <option value="wagon_num">Номер вагона</option>
                <option value="batch">Партия</option>
                <option value="grade">Марка</option>
                <option value="position">Позиция</option>
                <option value="order_id">ID заказа</option>
                <option value="closed">Статус</option>
            </select>
        </div>
        <div class="filter-group">
            <label for="sortDirection">Порядок:</label>
            <select id="sortDirection">
                <option value="asc">Возрастание</option>
                <option value="desc">Убывание</option>
            </select>
        </div>

        <div class="filter-actions">
            <button class="btn btn-primary" id="applyFilters">Применить настройки</button>
        </div>
    </div>

    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>ID Карты</th>
                    <th>ID Заказа</th>
                    <th>Номер вагона</th>
                    <th>Партия</th>
                    <th>Марка стали</th>
                    <th>Позиция (Склад)</th>
                    <th>Текущий статус</th>
                </tr>
            </thead>
            <tbody id="cardsContainer">
                <tr>
                    <td colspan="7" class="loading">Загрузка данных с сервера...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div id="loadingMoreIndicator" class="loading-more" style="display: none;">Загрузка данных...</div>
</div>

<button class="scroll-to-top" id="scrollToTop" title="Наверх">▲</button>

<div id="footer-placeholder"></div>

<div class="modal-overlay" id="createModal">
    <div class="modal-content">
        <button class="modal-close" id="closeModal">&times;</button>
        <h2 class="modal-title">Новая формировочная карта</h2>
        <form id="createForm">
            <div class="form-row">
                <div class="filter-group">
                    <label for="order_id">ID заказа *</label>
                    <input type="text" id="order_id" required>
                </div>
                <div class="filter-group">
                    <label for="way">Путь (Way) *</label>
                    <input type="text" id="way" required>
                </div>
            </div>

            <div class="form-row">
                <div class="filter-group">
                    <label for="fc_gost_tt">ГОСТ ТТ</label>
                    <input type="text" id="fc_gost_tt">
                </div>
                <div class="filter-group">
                    <label for="fc_gost_xa">ГОСТ ХА</label>
                    <input type="text" id="fc_gost_xa">
                </div>
            </div>

            <div class="form-row">
                <div class="filter-group">
                    <label for="fc_gost_sort">ГОСТ сортировщика</label>
                    <input type="text" id="fc_gost_sort">
                </div>
                <div class="filter-group">
                    <label for="shipment_date">Дата отгрузки</label>
                    <input type="date" id="shipment_date">
                </div>
            </div>

            <div class="form-row">
                <div class="filter-group">
                    <label for="wagon_num">Номер вагона</label>
                    <input type="text" id="wagon_num">
                </div>
                <div class="filter-group">
                    <label for="group_num">Номер группы</label>
                    <input type="text" id="group_num">
                </div>
            </div>

            <div class="form-row">
                <div class="filter-group">
                    <label for="certificate">Сертификат</label>
                    <input type="text" id="certificate">
                </div>
                <div class="filter-group">
                    <label for="position">Место складирования</label>
                    <input type="text" id="position" maxlength="5" placeholder="Пример: 12-34">
                </div>
            </div>

            <button type="submit" class="btn btn-primary form-submit">Создать карту в системе</button>
        </form>
    </div>
</div>

<script>
    // Загрузка компонентов Header и Footer
    async function loadComponents() {
        try {
            const headerRes = await fetch('/static/components/header.html');
            if (headerRes.ok) document.getElementById('header-placeholder').innerHTML = await headerRes.text();

            const footerRes = await fetch('/static/components/footer.html');
            if (footerRes.ok) document.getElementById('footer-placeholder').innerHTML = await footerRes.text();
        } catch (error) {
            console.error('Ошибка загрузки компонентов шапки/подвала:', error);
        }
    }

    let currentPage = 1;
    const pageSize = 25;
    let currentSortField = 'card_id';
    let currentSortDirection = 'asc';
    let isLoading = false;
    let hasMore = true;

    async function fetchCards(page = 1) {
        try {
            isLoading = true;
            if (page > 1) document.getElementById('loadingMoreIndicator').style.display = 'block';

            const requestBody = {
                fields: ['card_id', 'wagon_num', 'batch', 'grade', 'position', 'order_id', 'closed'],
                page_number: page,
                page_size: pageSize,
                order_by: currentSortField,
                order_direction: currentSortDirection
            };

            const filters = getFilters();
            if (Object.keys(filters).length > 0) requestBody.filters = filters;

            const response = await fetch('/api/formation_cards/get', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(requestBody)
            });

            if (!response.ok) throw new Error(`Ошибка сервера: ${response.status}`);
            const data = await response.json();
            hasMore = data.length === pageSize;
            return data;
        } catch (error) {
            console.error(error);
            return null;
        } finally {
            isLoading = false;
            document.getElementById('loadingMoreIndicator').style.display = 'none';
        }
    }

    function getFilters() {
        const filters = {};
        const fields = ['cardId', 'wagonNum', 'batch', 'grade', 'position', 'orderId'];
        const map = { cardId: 'card_id', wagonNum: 'wagon_num', batch: 'batch', grade: 'grade', position: 'position', orderId: 'order_id' };

        fields.forEach(field => {
            const val = document.getElementById(`filter${field.charAt(0).toUpperCase() + field.slice(1)}`).value.trim();
            if (val) filters[map[field]] = val;
        });

        const closed = document.getElementById('filterStatus').value;
        if (closed !== "") filters.closed = closed === "1";

        return filters;
    }

    async function loadCards(reset = false) {
        const tbody = document.getElementById('cardsContainer');
        if (reset) {
            tbody.innerHTML = '<tr><td colspan="7" class="loading">Загрузка данных...</td></tr>';
            currentPage = 1;
            hasMore = true;
        }

        try {
            const cards = await fetchCards(currentPage);
            if (!cards || cards.length === 0) {
                if (reset) tbody.innerHTML = '<tr><td colspan="7" class="error">Карты формирования не найдены</td></tr>';
                hasMore = false;
                return;
            }

            if (reset) tbody.innerHTML = '';
            cards.forEach(card => tbody.appendChild(createCardRow(card)));
            currentPage++;
        } catch (error) {
            tbody.innerHTML = `<tr><td colspan="7" class="error">Ошибка: ${error.message}</td></tr>`;
        }
    }

    function createCardRow(card) {
        const tr = document.createElement('tr');

        // Переход по клику на всю область строки
        tr.onclick = () => {
            window.location.href = `/html/current_fk/?id=${card.card_id}`;
        };

        const statusText = card.closed ? 'Закрыта' : 'Открыта';
        const statusClass = card.closed ? 'status-closed' : 'status-open';

        tr.innerHTML = `
            <td><strong>${card.card_id || '—'}</strong></td>
            <td>${card.order_id || '—'}</td>
            <td>${card.wagon_num || '—'}</td>
            <td>${card.batch || '—'}</td>
            <td>${card.grade || '—'}</td>
            <td>${card.position || '—'}</td>
            <td><span class="status-badge ${statusClass}">${statusText}</span></td>
        `;
        return tr;
    }

    function isScrollNearBottom() {
        return (window.innerHeight + window.scrollY) >= document.body.offsetHeight - 100;
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadComponents();
        loadCards(true);
        window.addEventListener('scroll', () => {
            if (isScrollNearBottom() && !isLoading && hasMore) loadCards(false);
        });
    });

    document.getElementById('scrollToTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    document.getElementById('applyFilters').addEventListener('click', () => {
        currentSortField = document.getElementById('sortField').value;
        currentSortDirection = document.getElementById('sortDirection').value;
        loadCards(true);
    });

    // Модальное окно
    const modal = document.getElementById('createModal');
    document.getElementById('createFkButton').addEventListener('click', () => modal.classList.add('active'));
    document.getElementById('closeModal').addEventListener('click', () => modal.classList.remove('active'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('active'); });

    document.getElementById('position').addEventListener('input', function() {
        let value = this.value.replace(/\D/g, '');
        if (value.length > 2) value = value.substring(0, 2) + '-' + value.substring(2, 4);
        this.value = value;
    });

    document.getElementById('createForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const posInput = document.getElementById('position');
        const posValue = posInput.value.trim();

        if (posValue && !/^\d+-\d+$/.test(posValue)) {
            alert('Формат места складирования должен быть ХХ-ХХ (например, 01-24)');
            posInput.focus();
            return;
        }

        const cardData = {
            order_id: document.getElementById('order_id').value,
            way: document.getElementById('way').value,
            worker_id: 1,
            params: {
                fc_gost_tt: document.getElementById('fc_gost_tt').value || null,
                fc_gost_xa: document.getElementById('fc_gost_xa').value || null,
                fc_gost_sort: document.getElementById('fc_gost_sort').value || null,
                shipment_date: document.getElementById('shipment_date').value || null,
                wagon_num: document.getElementById('wagon_num').value || null,
                group_num: document.getElementById('group_num').value || null,
                certificate: document.getElementById('certificate').value || null,
                position: posValue || null
            }
        };

        try {
            const response = await fetch('/api/formation_cards/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(cardData)
            });
            if (!response.ok) throw new Error('Ошибка на сервере API');
            const result = await response.json();
            alert(`Карта успешно создана. ID: ${result.card_id}`);
            modal.classList.remove('active');
            document.getElementById('createForm').reset();
            loadCards(true);
        } catch (error) {
            alert('Ошибка создания: ' + error.message);
        }
    });
</script>
</body>
</html>
